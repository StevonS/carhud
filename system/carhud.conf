# /etc/carhud.conf: CarHUD settings.
# After changing anything: sudo systemctl restart carhud   (screen settings: carhud screens)
# Updates add new settings to the end of this file and never change the ones you set.

# ---- screens -------------------------------------------------------------
# Open the HUD and desk screens at login (1) or just the plain desktop (0). Also: carhud-mode kiosk|desktop
AUTOSTART=1

# Which output is which. "auto" = HUD on the first HDMI output, desk on the DSI screen or the other output.
# Names on a Pi 3: HDMI-1, DSI-1. List them with: DISPLAY=:0 xrandr
HUD_OUTPUT=auto
DESK_OUTPUT=auto

# Mirror the HUD left-right for the windshield (1). Leave 0 on a normal monitor.
HUD_MIRROR=0
# Flip the HUD upside down (1), for some mounting angles.
HUD_FLIP=0
# Show where BMW's own speed readout would be (1). Not on a non-BMW car.
HUD_BMW_ZONE=0

# ---- what drives the HUD -------------------------------------------------
# auto   = the car over OBD-II when the adapter is plugged in, otherwise the demo
# demo   = the HUD app's own demo loop
# manual = fixed values you set in the control panel or with carhud set
# obd    = always the car (shows parked while the car doesn't answer)
HUD_SOURCE=auto

# ---- OBD-II adapter (ELM327 USB cable) -----------------------------------
OBD_ENABLE=1
# auto = the first USB serial adapter. Or a path, e.g. /dev/ttyUSB0 or /dev/serial/by-id/usb-FTDI_...
OBD_DEVICE=auto
# auto tries 38400, 115200, 9600, 230400, 500000
OBD_BAUD=auto
# ELM327 protocol number, 0 = find it automatically (6 = CAN 11-bit 500k, most cars since 2008)
OBD_PROTOCOL=0
# Ask for several readings per request on CAN cars (faster). 0 if your adapter has trouble with it.
OBD_MULTI=auto
# Engine rpm per km/h in each gear, to show the gear. Work yours out with: carhud gears <final drive> <tyre> <ratios...>
OBD_GEAR_RATIOS=
# Stoichiometric air-fuel ratio of your fuel (14.7 petrol, 9.8 E85), for AFR from the lambda sensor
OBD_FUEL_AFR=14.7

# ---- desk (second screen) ------------------------------------------------
# An app to open at start instead of the home screen, e.g. gauges
DESK_HOME=
# Your own desk apps live here (one folder per app, see the README)
USER_APPS_DIR=/home/USER/carhud-apps
# Music and videos for the Music app
MEDIA_DIR=/home/USER/Music
# A CarPlay (or any other) web player: adds a CarPlay tile to the desk, e.g. http://127.0.0.1:3000
CARPLAY_URL=

# ---- server --------------------------------------------------------------
HUD_PORT=8078
# Let other devices on the network open the control panel (1), or only this Pi (0)
ALLOW_LAN=1
# Allow update / restart / reboot from other devices too (1), not only from the Pi's own screens (0)
ALLOW_LAN_SYSTEM=0

# ---- HUD project ---------------------------------------------------------
EVA_DIR=/opt/evahud
# Rebuild the HUD app automatically when you edit its files in EVA_DIR (1). Uses more CPU.
EVA_WATCH=0
