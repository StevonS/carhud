# /etc/carhud.conf: CarHUD settings.
# After changing anything: sudo systemctl restart carhud   (screen settings: carhud screens)
# Updates add new settings to the end of this file and never change the ones you set.

# ---- screens -------------------------------------------------------------
# Open the HUD and desk screens at login (1) or just the plain desktop (0). Also: carhud-mode kiosk|desktop
AUTOSTART=1

# What each display shows is chosen in the control panel (Screens), the desk's System app or with
# `carhud screens set <output> <screen>`. These only decide the very first layout:
# "auto" = HUD on the first HDMI output, desk on the DSI screen or the other output.
HUD_OUTPUT=auto
DESK_OUTPUT=auto

# Mirror the HUD left-right for the windshield (1). Leave 0 on a normal monitor.
HUD_MIRROR=0
# Flip the HUD upside down (1), for some mounting angles.
HUD_FLIP=0
# Show where BMW's own speed readout would be (1). Not on a non-BMW car.
HUD_BMW_ZONE=0

# ---- the 3.5" touch LCD on the header pins ---------------------------------
# Set up with: sudo carhud lcd setup MODEL [ROTATE]  (carhud lcd list), then reboot. It shows the debug
# console; choose something else for "LCD" under Screens.
LCD_MODEL=
LCD_ROTATE=90
# Picture updates per second copied to the LCD (it costs CPU on a Pi 3: 10-25)
LCD_FPS=20
# Touch lands in the wrong place? Use "Calibrate touch" in the control panel. Or override the model's
# calibration: "minx maxx miny maxy" (raw 0-4095) and whether X/Y are swapped (0/1)
LCD_TOUCH_CAL=
LCD_TOUCH_SWAP=

# ---- what drives the HUD -------------------------------------------------
# auto   = the car over OBD-II when the adapter is plugged in, otherwise the demo
# demo   = the HUD app's own demo loop
# manual = fixed values you set in the control panel or with carhud set
# obd    = always the car (shows parked while the car doesn't answer)
HUD_SOURCE=auto

# ---- OBD-II adapter (ELM327 USB cable) -----------------------------------
OBD_ENABLE=1
# auto = the first USB serial adapter. Or a path, e.g. /dev/ttyUSB0 or /dev/serial/by-id/usb-FTDI_...
OBD_DEVICE=auto
# auto tries 38400, 115200, 9600, 230400, 500000
OBD_BAUD=auto
# ELM327 protocol number, 0 = find it automatically (6 = CAN 11-bit 500k, most cars since 2008)
OBD_PROTOCOL=0
# Ask for several readings per request on CAN cars (faster). 0 if your adapter has trouble with it.
OBD_MULTI=auto
# Engine rpm per km/h in each gear, to show the gear. Work yours out with: carhud gears <final drive> <tyre> <ratios...>
OBD_GEAR_RATIOS=
# Stoichiometric air-fuel ratio of your fuel (14.7 petrol, 9.8 E85), for AFR from the lambda sensor
OBD_FUEL_AFR=14.7

# ---- phone link ----------------------------------------------------------
# Bluetooth: phones pair with the Pi for music, now playing and (iPhone) notifications and calls
PHONE_BLUETOOTH=1
# The name phones see
PHONE_NAME=CarHUD
# iPhone notifications over Bluetooth LE (also answers / declines calls from the desk)
PHONE_NOTIFICATIONS=1
# 0: while "Pair a phone" is on (3 min), phones pair by themselves; you confirm the code on the phone.
# 1: a screen (desk, control panel, phone app) must also say yes to every pairing.
PHONE_PAIR_CONFIRM=0
# Where phone music plays. Leave "default" and pick the output with `carhud audio` or the control panel
# (Sound output): a USB sound card for the car's AUX, the 3.5 mm jack or HDMI.
PHONE_AUDIO_DEVICE=default
# Wi-Fi hotspot for the phone app in the car: auto (when no known Wi-Fi is around) | on (always) | off
PHONE_AP=auto
PHONE_AP_SSID=CarHUD
# What runs the hotspot: hostapd (plain WPA2, logs each phone's join) or nm (NetworkManager's own hotspot,
# which offers WPA-PSK-SHA256 too; the Pi's Wi-Fi chip then refuses phones on a passworded hotspot)
PHONE_AP_BACKEND=hostapd
# 2.4 GHz channel for the hotspot (1, 6 or 11 are best)
PHONE_AP_CHANNEL=6
# Made up by the installer when empty
PHONE_AP_PASSWORD=
# The phone app (location, navigation) is on https here; browsers only share GPS with https pages
PHONE_HTTPS_PORT=8443
# Search and routing services the phone uses with its own mobile data (OpenStreetMap ones by default)
PHONE_GEOCODER_URL=https://nominatim.openstreetmap.org
PHONE_ROUTER_URL=https://router.project-osrm.org
# Show the next turn on the HUD while navigating
HUD_NAV=1

# ---- desk (second screen) ------------------------------------------------
# An app to open at start instead of the home screen, e.g. gauges
DESK_HOME=
# Your own desk apps live here (one folder per app, see the README)
USER_APPS_DIR=/home/USER/carhud-apps
# Music and videos for the Music app
MEDIA_DIR=/home/USER/Music
# A CarPlay dongle player (or any web app): adds a CarPlay tile to the desk, e.g. http://127.0.0.1:3000
CARPLAY_URL=

# ---- server --------------------------------------------------------------
HUD_PORT=8078
# Also answer on port 80, so phones can open http://10.42.0.1 or http://carhud.local without :8078
HTTP_PORT_80=1
# Let other devices on the network open the control panel (1), or only this Pi (0)
ALLOW_LAN=1
# Allow update / restart / reboot from other devices too (1), not only from the Pi's own screens (0)
ALLOW_LAN_SYSTEM=0

# ---- HUD project ---------------------------------------------------------
EVA_DIR=/opt/evahud
# Rebuild the HUD app automatically when you edit its files in EVA_DIR (1). Uses more CPU.
EVA_WATCH=0
