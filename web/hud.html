<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CarHUD display</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  canvas { position: absolute; inset: 0; width: 100vw; height: 100vh; object-fit: contain; image-rendering: auto; }
  body.native canvas { width: auto; height: auto; object-fit: none; }
  body.mirror canvas { transform: scaleX(-1); }
  body.flip canvas { transform: scaleY(-1); }
  body.mirror.flip canvas { transform: scale(-1, -1); }
  #stats { position: absolute; left: 8px; bottom: 8px; font: 12px/1.4 monospace; color: #7fdc9a; background: rgba(0,0,0,.7); padding: 6px 8px; border-radius: 4px; display: none; white-space: pre; }
  body.stats #stats { display: block; }
  #lost { position: absolute; right: 10px; top: 10px; width: 12px; height: 12px; border-radius: 50%; background: #ff3b30; display: none; }
  body.lost #lost { display: block; }
</style>
</head>
<body>
<canvas id="c" width="800" height="480"></canvas>
<div id="stats"></div>
<div id="lost" title="connection to the carhud server lost"></div>
<script src="/js/carhud.js"></script>
<script src="/js/hudview.js"></script>
<script>
/* The HUD on its own screen.
 *   /hud?mirror=1   flip left-right for the windshield      /hud?flip=1   flip upside down
 *   /hud?bmw=1      show where BMW's own speed readout sits    /hud?native=1 draw 1:1 instead of filling the screen
 *   /hud?stats=1    frame rate, data rate and latency          /hud?target=panel  another target
 * Keys: s stats, m mirror, f flip, o outlines, b BMW speed, n native size, r reload
 */
(function () {
  const q = new URLSearchParams(location.search), on = (k) => q.get(k) === '1';
  const body = document.body;
  ['mirror', 'flip', 'stats', 'native'].forEach((k) => body.classList.toggle(k, on(k)));
  const view = new HudView(document.getElementById('c'), { target: q.get('target') || 'hud', bmw: on('bmw'), outlines: on('outlines') });
  const link = CarHud.connect({ target: view.opts.target, data: false, fps: Number(q.get('fps')) || 0 }, {
    message: (m) => view.message(m),
    binary: (b) => view.binary(b),
    open: () => body.classList.remove('lost'),
  });
  setInterval(() => {
    body.classList.toggle('lost', !link.open && link.closedSince && Date.now() - link.closedSince > 2000);
    if (!body.classList.contains('stats')) return;
    const s = view.stats;
    document.getElementById('stats').textContent =
      'redraws ' + s.fps + '/s   updates ' + s.mps + '/s   ' + s.kbps + ' KB/s\n' +
      'frame age ' + (s.age === null ? '--' : s.age + ' ms') + '   round trip ' + (link.rtt === null ? '--' : link.rtt + ' ms') + '\n' +
      view.opts.target + '  ' + (link.open ? 'connected' : 'reconnecting');
  }, 500);
  document.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (k === 's') body.classList.toggle('stats');
    else if (k === 'm') body.classList.toggle('mirror');
    else if (k === 'f') body.classList.toggle('flip');
    else if (k === 'n') body.classList.toggle('native');
    else if (k === 'o') view.set('outlines', !view.opts.outlines);
    else if (k === 'b') view.set('bmw', !view.opts.bmw);
    else if (k === 'r') location.reload();
  });
})();
</script>
</body>
</html>
