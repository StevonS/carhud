<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hello</title>
<link rel="stylesheet" href="/css/carhud.css">
<style>
  body { height: 100vh; display: grid; place-items: center; text-align: center; }
  .big { font-size: 120px; font-weight: 800; color: var(--accent); line-height: 1; }
</style>
</head>
<body>
<div>
  <div class="big" id="speed">--</div>
  <div class="muted">km/h · an example desk app. Edit ~/carhud-apps/hello/, and set "hidden": false in its app.json to show it.</div>
</div>
<script src="/js/carhud.js"></script>
<script>
  CarHud.connect({}, {
    message(m) { if (m.t === 'values') document.getElementById('speed').textContent = CarHud.fmt(m.hud.speed); },
  });
</script>
</body>
</html>
